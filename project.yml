# xcodegen spec for 多多随身 (DuoDuo Pocket). Regenerate the project with `xcodegen generate`
# (scripts/build.sh does it). The generated .xcodeproj is not tracked.
name: DuoduoPocket
options:
  bundleIdPrefix: dev.openduo
  deploymentTarget:
    iOS: "17.0"
  # Chinese is the source language; English is the translation (String Catalogs).
  developmentLanguage: zh-Hans
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.1"
    CURRENT_PROJECT_VERSION: "6"
    # Opus.xcframework ships arm64 slices only (every supported iPhone and Apple-silicon Mac).
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
packages:
  PocketKit:
    path: Packages/PocketKit
targets:
  DuoduoPocket:
    type: application
    platform: iOS
    sources:
      # Includes App/PrivacyInfo.xcprivacy, which xcodegen puts in the Resources phase.
      - path: App
      - path: Shared
      # Shown in Settings › 关于多多随身 › 开源许可.
      - path: LICENSE
        buildPhase: resources
      - path: NOTICE
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - framework: Vendor/Tsbridge.xcframework
        embed: false
      - package: PocketKit
        product: PocketCore
      - package: PocketKit
        product: PocketOpus
      - target: DuoduoShare
    entitlements:
      path: App/DuoduoPocket.entitlements
      properties:
        com.apple.security.application-groups: [group.$(POCKET_BUNDLE_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(POCKET_BUNDLE_ID)
        PRODUCT_NAME: DuoduoPocket
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_BITCODE: NO
        # Source and regeneration: docs/design/icon/final/.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        # gomobile's tsnet needs libresolv.
        OTHER_LDFLAGS: ["-lresolv"]
    info:
      path: App/Info.plist
      properties:
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleDisplayName: 多多
        CFBundleName: DuoDuo Pocket
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Decision Q3: bluetooth-central for the Passport, audio for ambient mode
        # (started by the user in the foreground, ended by the user).
        # fetch: Background App Refresh catch-up of answers for the Passport.
        UIBackgroundModes: [bluetooth-central, audio, fetch]
        BGTaskSchedulerPermittedIdentifiers: [dev.openduo.pocket.refresh]
        NSBluetoothAlwaysUsageDescription: 多多随身通过蓝牙连接 Passport，接收按键录音并显示回复。
        NSMicrophoneUsageDescription: 按住说话和环境模式需要使用麦克风。
        NSCameraUsageDescription: 在对话中拍照上传和扫描配对二维码需要使用相机。
        NSPhotoLibraryUsageDescription: 在对话中上传图片需要访问照片。
        NSLocationWhenInUseUsageDescription: 在对话中发送位置时，用定位把地图移到你所在的地方；也用于设置里的「让多多知道我到了哪」。
        # Settings › 让多多知道我到了哪 (visit monitoring; off by default). No `location` background
        # mode: iOS relaunches the app for a visit by itself.
        NSLocationAlwaysAndWhenInUseUsageDescription: 只用来告诉你自己的多多你到了哪里。默认关闭，在设置里打开后才会使用。
        NSLocalNetworkUsageDescription: 内置的 Tailscale 节点会探测局域网以建立直连。
        # The share extension's hand-off (Shared/ShareInbox.swift).
        PocketAppGroup: group.$(POCKET_BUNDLE_ID)
        CFBundleURLTypes:
          - CFBundleURLName: $(POCKET_BUNDLE_ID)
            CFBundleURLSchemes: [duoduopocket]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Landscape is for the foldable's layouts; AppDelegate keeps every other iPhone portrait.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # The embedded Tailscale node (WireGuard: ChaCha20-Poly1305, Curve25519) uses standard
        # published algorithms, not proprietary ones, and the app is not on the French store.
        # App Store Connect requires export documentation only for proprietary cryptography or
        # third-party cryptography on the French store, so no document applies: `false`.
        # `true` without an approved document is rejected at upload and blocks the build.
        ITSAppUsesNonExemptEncryption: false
  # 多多 in the share sheet: images, files and text go to the composer (ShareExtension/).
  DuoduoShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Shared
    entitlements:
      path: ShareExtension/DuoduoShare.entitlements
      properties:
        com.apple.security.application-groups: [group.$(POCKET_BUNDLE_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(POCKET_BUNDLE_ID).share
        PRODUCT_NAME: DuoduoShare
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleDisplayName: 多多
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        PocketAppGroup: group.$(POCKET_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Any image, file or text; a share with none of them does not list 多多.
            NSExtensionActivationRule: >-
              SUBQUERY(extensionItems, $item, SUBQUERY($item.attachments, $a,
              ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "public.data"
              OR ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "public.url").@count > 0).@count > 0
schemes:
  DuoduoPocket:
    build:
      targets:
        DuoduoPocket: all
    run:
      config: Debug
